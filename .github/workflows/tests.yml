name: tests

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional test dependencies
        run: python -m pip install pillow==12.3.0 cryptography==50.0.2
      - name: Unit suites
        run: |
          python tests/foods_test.py
          python tests/providers_test.py
          python tests/adaptive_test.py
          python tests/jev_test.py
          python tests/schema_migrate_test.py
          python tests/photos_test.py
          python tests/auth_state_test.py
          python tests/icons_test.py
      - name: API suite
        run: |
          export MACROLOG_DATA="$(mktemp -d)"
          # A free port, and proof that OUR server answered (not something else
          # already listening on a fixed port).
          PORT=$(python -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1])')
          python server.py --port "$PORT" --no-browser > /tmp/macrolog-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 150); do
            kill -0 "$SERVER_PID" 2>/dev/null || { cat /tmp/macrolog-server.log; exit 1; }
            if curl -sf "http://127.0.0.1:$PORT/healthz" >/dev/null; then break; fi
            sleep 0.2
          done
          curl -sf "http://127.0.0.1:$PORT/healthz" >/dev/null || { cat /tmp/macrolog-server.log; exit 1; }
          python tests/api_test.py "http://127.0.0.1:$PORT" || { cat /tmp/macrolog-server.log; exit 1; }
      - name: Auth flow suite
        run: |
          python tests/auth_test.py
          python tests/auth_race_test.py
