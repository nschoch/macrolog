name: tests

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional test dependencies
        run: python -m pip install --upgrade pip pillow
      - name: Unit suites
        run: |
          python tests/foods_test.py
          python tests/providers_test.py
          python tests/adaptive_test.py
          python tests/jev_test.py
          python tests/schema_migrate_test.py
          python tests/photos_test.py
          python tests/auth_state_test.py
      - name: API suite
        run: |
          export MACROLOG_DATA="$(mktemp -d)"
          python server.py --port 8790 --no-browser > /tmp/macrolog-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 150); do
            if curl -sf http://127.0.0.1:8790/ >/dev/null; then break; fi
            sleep 0.2
          done
          curl -sf http://127.0.0.1:8790/ >/dev/null || { cat /tmp/macrolog-server.log; exit 1; }
          python tests/api_test.py http://127.0.0.1:8790
      - name: Auth flow suite
        run: python tests/auth_test.py
